<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시바이누 급등 코인 추종 시뮬레이터</title>
  <style>
    /* 화면의 기본 글꼴과 여백을 깔끔하게 잡아줍니다 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">배포 테스트 성공</span>
    <h1>🐕 시바이누 급등 코인 추종 시뮬레이터</h1>
    <p>웹사이트 기초 뼈대가 성공적으로 배포되었습니다.</p>
    <p>다음 단계에서 업비트 실시간 시세 연동 및 수익률 비교 기능을 연결합니다.</p>
  </div>
</body>
</html>
