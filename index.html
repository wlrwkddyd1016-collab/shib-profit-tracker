<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시바이누 자산 & 코인 실시간 수익률 비교기</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #f59e0b;
      --up: #ef4444;
      --down: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .header p {
      font-size: 14px;
      color: var(--text-sub);
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .coin-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0f172a;
      padding: 2px;
      object-fit: cover;
    }

    .coin-header-info h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .coin-header-info span {
      font-size: 12px;
      color: var(--text-sub);
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-box:focus {
      border-color: var(--primary);
    }

    select.input-box {
      cursor: pointer;
    }

    .info-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-sub);
    }

    .info-value {
      font-weight: 600;
    }

    .up { color: var(--up); }
    .down { color: var(--down); }

    .period-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .period-btn {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .period-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .comparison-summary {
      margin-top: auto;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1e293b, #111827);
      border: 1px solid #475569;
      text-align: center;
    }

    .comparison-diff {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    .diff-desc {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .status-badge {
      font-size: 13px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🐕 시바이누 자산 & 코인 실시간 수익률 비교기</h1>
    <p>업비트 실시간 웹소켓 시세 연동</p>
  </div>

  <div class="container">
    <!-- 왼쪽: 시바이누 보유 자산 카드 -->
    <div class="card">
      <div class="card-title-row">
        <img class="coin-logo" src="https://static.upbit.com/logos/SHIB.png" alt="SHIB 로고" />
        <div class="coin-header-info">
          <h2>시바이누 (SHIB)</h2>
          <span>내 보유 기준 코인</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="shibCount">보유 수량 (개)</label>
        <input type="number" id="shibCount" class="input-box" value="10000000" step="1000" />
      </div>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">실시간 현재가</span>
          <span class="info-value" id="shibPrice">연결 중...</span>
        </div>
        <div class="info-row">
          <span class="info-label">당일 24시간 변동률</span>
          <span class="info-value" id="shibRate24h">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">선택 기간 수익률</span>
          <span class="info-value" id="shibPeriodRate">-</span>
        </div>
        <div class="info-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);">
          <span class="info-label">내 평가 금액</span>
          <span class="info-value" style="font-size: 17px; color: #f59e0b;" id="shibTotalValue">0 원</span>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 비교 대상 코인 선택 카드 -->
    <div class="card">
      <div class="card-title-row">
        <img id="targetCoinLogo" class="coin-logo" src="https://static.upbit.com/logos/BTC.png" alt="코인 로고" />
        <div class="coin-header-info">
          <h2 id="targetCoinTitle">비트코인 (BTC)</h2>
          <span>비교 대상 코인</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">비교 기간 선택</label>
        <div class="period-selector">
          <button class="period-btn active" data-days="0">24시간 (실시간)</button>
          <button class="period-btn" data-days="7">최근 7일</button>
          <button class="period-btn" data-days="14">최근 14일</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="coinSelect">비교 코인 선택 (업비트/빗썸 상장 코인)</label>
        <select id="coinSelect" class="input-box"></select>
      </div>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">선택 코인 현재가</span>
          <span class="info-value" id="targetPrice">연결 중...</span>
        </div>
        <div class="info-row">
          <span class="info-label">선택 코인 수익률</span>
          <span class="info-value" id="targetRate">-</span>
        </div>
      </div>

      <div class="comparison-summary">
        <div class="field-label" style="color: #cbd5e1;">시바이누 대비 상승 격차</div>
        <div class="comparison-diff" id="rateDiff">-</div>
        <div class="diff-desc" id="diffDescription">시세를 불러오는 중입니다...</div>
      </div>
    </div>
  </div>

  <div class="status-badge" id="updateStatus">🟢 웹소켓 연결 준비 중...</div>

  <script>
    const COIN_LIST = [
      { market: "KRW-BTC", symbol: "BTC", name: "비트코인" },
      { market: "KRW-ETH", symbol: "ETH", name: "이더리움" },
      { market: "KRW-SOL", symbol: "SOL", name: "솔라나" },
      { market: "KRW-XRP", symbol: "XRP", name: "리플" },
      { market: "KRW-DOGE", symbol: "DOGE", name: "도지코인" },
      { market: "KRW-ADA", symbol: "ADA", name: "에이다" },
      { market: "KRW-AVAX", symbol: "AVAX", name: "아발란체" },
      { market: "KRW-SEI", symbol: "SEI", name: "세이" },
      { market: "KRW-NEAR", symbol: "NEAR", name: "니어프로토콜" },
      { market: "KRW-SUI", symbol: "SUI", name: "수이" },
      { market: "KRW-APT", symbol: "APT", name: "앱토스" },
      { market: "KRW-LINK", symbol: "LINK", name: "체인링크" },
      { market: "KRW-ETC", symbol: "ETC", name: "이더리움클래식" },
      { market: "KRW-SAND", symbol: "SAND", name: "샌드박스" }
    ];

    let currentDays = 0;
    const tickerCache = {};
    const candleCache = {};

    const shibCountInput = document.getElementById("shibCount");
    const shibPriceEl = document.getElementById("shibPrice");
    const shibRate24hEl = document.getElementById("shibRate24h");
    const shibPeriodRateEl = document.getElementById("shibPeriodRate");
    const shibTotalValueEl = document.getElementById("shibTotalValue");

    const coinSelect = document.getElementById("coinSelect");
    const targetCoinLogo = document.getElementById("targetCoinLogo");
    const targetCoinTitle = document.getElementById("targetCoinTitle");
    const targetPriceEl = document.getElementById("targetPrice");
    const targetRateEl = document.getElementById("targetRate");
    const rateDiffEl = document.getElementById("rateDiff");
    const diffDescriptionEl = document.getElementById("diffDescription");
    const updateStatusEl = document.getElementById("updateStatus");

    function initCoinOptions() {
      coinSelect.innerHTML = COIN_LIST.map(coin => 
        `<option value="${coin.market}" data-symbol="${coin.symbol}" data-name="${coin.name}">${coin.name} (${coin.symbol})</option>`
      ).join("");
    }

    const formatKRW = (num) => new Intl.NumberFormat('ko-KR').format(Math.round(num)) + ' 원';
    const formatCoinPrice = (num) => {
      if (!num || isNaN(num)) return '- 원';
      if (num < 1) return num.toFixed(4) + ' 원';
      if (num < 100) return num.toFixed(2) + ' 원';
      return new Intl.NumberFormat('ko-KR').format(Math.round(num)) + ' 원';
    };
    const formatRateText = (rate) => `${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%`;

    // 7일/14일 캔들 데이터 (CORS 프록시 적용)
    async function getPeriodRate(market, days) {
      if (days === 0) {
        return tickerCache[market]?.rate24h ?? 0;
      }
      const cacheKey = `${market}_${days}`;
      if (candleCache[cacheKey] !== undefined) return candleCache[cacheKey];

      try {
        const targetUrl = `https://api.upbit.com/v1/candles/days?market=${market}&count=${days + 1}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl);
        const candles = await res.json();

        if (Array.isArray(candles) && candles.length >= days + 1) {
          const current = candles[0].trade_price;
          const past = candles[days].trade_price;
          const rate = ((current - past) / past) * 100;
          candleCache[cacheKey] = rate;
          return rate;
        }
      } catch (e) {
        console.warn(`${market} 캔들 조회 실패:`, e);
      }
      return tickerCache[market]?.rate24h ?? 0;
    }

    async function renderUI() {
      const shib = tickerCache["KRW-SHIB"];
      const targetMarket = coinSelect.value;
      const target = tickerCache[targetMarket];

      const targetOption = coinSelect.options[coinSelect.selectedIndex];
      const targetSymbol = targetOption?.getAttribute("data-symbol") || "BTC";
      const targetName = targetOption?.getAttribute("data-name") || "비트코인";

      targetCoinLogo.src = `https://static.upbit.com/logos/${targetSymbol}.png`;
      targetCoinTitle.innerText = `${targetName} (${targetSymbol})`;

      if (!shib || !target) return;

      // 시바이누 정보
      shibPriceEl.innerText = formatCoinPrice(shib.price);
      shibRate24hEl.innerText = formatRateText(shib.rate24h);
      shibRate24hEl.className = `info-value ${shib.rate24h >= 0 ? 'up' : 'down'}`;

      const shibPeriod = await getPeriodRate("KRW-SHIB", currentDays);
      shibPeriodRateEl.innerText = formatRateText(shibPeriod);
      shibPeriodRateEl.className = `info-value ${shibPeriod >= 0 ? 'up' : 'down'}`;

      const count = parseFloat(shibCountInput.value) || 0;
      const shibTotalVal = count * shib.price;
      shibTotalValueEl.innerText = formatKRW(shibTotalVal);

      // 대상 코인 정보
      targetPriceEl.innerText = formatCoinPrice(target.price);
      const targetPeriod = await getPeriodRate(targetMarket, currentDays);
      targetRateEl.innerText = formatRateText(targetPeriod);
      targetRateEl.className = `info-value ${targetPeriod >= 0 ? 'up' : 'down'}`;

      // 격차 계산
      const diffRate = targetPeriod - shibPeriod;
      rateDiffEl.innerText = `${diffRate >= 0 ? '+' : ''}${diffRate.toFixed(2)}%p`;
      rateDiffEl.className = `comparison-diff ${diffRate >= 0 ? 'up' : 'down'}`;

      const diffAmount = shibTotalVal * (diffRate / 100);
      const signText = diffAmount >= 0 ? '더 높았을 금액' : '적었을 금액';
      diffDescriptionEl.innerText = `내 자산 기준 ${formatKRW(Math.abs(diffAmount))} ${signText}`;
    }

    // 업비트 공식 웹소켓 연결 (CORS 제한 없음)
    function connectWebSocket() {
      const socket = new WebSocket("wss://api.upbit.com/websocket/v1");
      socket.binaryType = "blob";

      socket.onopen = () => {
        updateStatusEl.innerText = "🟢 업비트 실시간 시세 연동 중";
        const codes = ["KRW-SHIB", ...COIN_LIST.map(c => c.market)];
        const payload = [
          { ticket: "shib-tracker" },
          { type: "ticker", codes: codes }
        ];
        socket.send(JSON.stringify(payload));
      };

      socket.onmessage = async (event) => {
        try {
          const text = await event.data.text();
          const data = JSON.parse(text);
          if (data && data.code) {
            tickerCache[data.code] = {
              price: data.trade_price,
              rate24h: data.signed_change_rate * 100
            };
            renderUI();
          }
        } catch (e) {
          console.error("데이터 파싱 에러:", e);
        }
      };

      socket.onerror = (err) => {
        console.error("웹소켓 에러:", err);
        updateStatusEl.innerText = "⚠️ 실시간 연결 재시도 중...";
      };

      socket.onclose = () => {
        updateStatusEl.innerText = "🔌 연결 재시도 중 (3초 후 연결)...";
        setTimeout(connectWebSocket, 3000);
      };
    }

    shibCountInput.addEventListener("input", renderUI);
    coinSelect.addEventListener("change", renderUI);

    document.querySelectorAll(".period-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentDays = parseInt(e.target.getAttribute("data-days"), 10);
        renderUI();
      });
    });

    initCoinOptions();
    connectWebSocket();
  </script>
</body>
</html>
