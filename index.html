<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시바이누 급등 코인 추종 시뮬레이터</title>
  <style>
    /* 전체 기본 스타일 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 540px;
      margin: 30px auto;
      padding: 16px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: #f97316;
    }

    /* 시바이누 현재 상태 박스 */
    .status-box {
      background: #fff7ed;
      border: 1px solid #ffedd5;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .shib-val {
      font-weight: 700;
      color: #ea580c;
    }

    /* 기간 선택 버튼 (1주 vs 2주) */
    .period-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .period-btn {
      flex: 1;
      padding: 10px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .period-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* 1등 급등 코인 결과 카드 */
    .result-box {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1.5px solid #bfdbfe;
      padding: 18px;
      border-radius: 14px;
      margin-top: 14px;
    }
    .winner-badge {
      display: inline-block;
      background: #2563eb;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .simulation-result {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #93c5fd;
    }
    .big-money {
      font-size: 22px;
      font-weight: 800;
      color: #1d4ed8;
      margin: 4px 0;
    }
    .diff-profit {
      font-size: 13px;
      font-weight: 600;
      color: #dc2626;
    }

    /* 새로고침 버튼 */
    .btn {
      width: 100%;
      background: #f97316;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background: #ea580c;
    }
    .status-text {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐕 시바이누 자산 & 급등 추종기</h1>

    <!-- 1. 보유량 입력 -->
    <div class="input-group">
      <label for="shibCount">보유한 시바이누(SHIB) 개수</label>
      <input type="number" id="shibCount" value="10000000" step="1000">
    </div>

    <!-- 2. 현재 시바이누 평가 금액 -->
    <div class="status-box">
      <div class="row">
        <span>업비트 SHIB 현재가</span>
        <span id="shibPrice" class="shib-val">조회 중...</span>
      </div>
      <div class="row">
        <span>현재 내 평가 금액</span>
        <span id="currentTotal" class="shib-val">0 원</span>
      </div>
    </div>

    <!-- 3. 비교 기간 선택 (7일 vs 14일) -->
    <label>비교할 급등 기간 선택</label>
    <div class="period-selector">
      <button class="period-btn active" data-days="7" id="btn7Days">최근 1주일 (7일)</button>
      <button class="period-btn" data-days="14" id="btn14Days">최근 2주일 (14일)</button>
    </div>

    <!-- 4. 1등 코인 추종 시뮬레이션 결과 -->
    <div class="result-box">
      <span class="winner-badge" id="winnerText">기간 내 최고 상승 코인 탐색 중...</span>
      <div class="row">
        <span id="winnerName" style="font-weight: 700; font-size: 16px;">-</span>
        <span id="winnerRate" style="font-weight: 800; font-size: 16px; color: #dc2626;">+0.00%</span>
      </div>

      <div class="simulation-result">
        <span style="font-size: 13px; color: #475569;">이 코인의 상승률을 그대로 탔다면?</span>
        <div class="big-money" id="simulatedTotal">0 원</div>
        <div class="diff-profit" id="diffProfit">+0 원 추가 수익 기대</div>
      </div>
    </div>

    <button class="btn" id="refreshBtn">데이터 새로고침</button>
    <div class="status-text" id="updatedTime">마지막 업데이트: -</div>
  </div>

  <script>
    // 분석 대상 코인 목록 (업비트 주요 거래대금 & 변동성 대표 코인)
    const TARGET_COINS = [
      { market: 'KRW-DOGE', name: '도지코인' },
      { market: 'KRW-XRP',  name: '리플' },
      { market: 'KRW-SOL',  name: '솔라나' },
      { market: 'KRW-SUI',  name: '수이' },
      { market: 'KRW-PEPE', name: '페페' },
      { market: 'KRW-BONK', name: '봉크' },
      { market: 'KRW-SEI',  name: '세이' },
      { market: 'KRW-BTC',  name: '비트코인' }
    ];

    let currentShibPrice = 0;
    let selectedDays = 7; // 기본 7일(1주)
    let bestCoin = { name: '', rate: 0 };

    // 화면 부품들 가져오기
    const shibCountInput = document.getElementById('shibCount');
    const shibPriceEl = document.getElementById('shibPrice');
    const currentTotalEl = document.getElementById('currentTotal');
    const winnerTextEl = document.getElementById('winnerText');
    const winnerNameEl = document.getElementById('winnerName');
    const winnerRateEl = document.getElementById('winnerRate');
    const simulatedTotalEl = document.getElementById('simulatedTotal');
    const diffProfitEl = document.getElementById('diffProfit');
    const updatedTimeEl = document.getElementById('updatedTime');
    const btn7Days = document.getElementById('btn7Days');
    const btn14Days = document.getElementById('btn14Days');
    const refreshBtn = document.getElementById('refreshBtn');

    // 1. 시바이누 실시간 가격 조회
    async function fetchShibPrice() {
      try {
        const res = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-SHIB');
        const data = await res.json();
        currentShibPrice = data[0].trade_price;
        shibPriceEl.innerText = `${currentShibPrice.toLocaleString(undefined, { minimumFractionDigits: 4 })} 원`;
        updateCalculations();
      } catch (err) {
        console.error('시바이누 가격 조회 실패:', err);
      }
    }

    // 2. 단일 코인의 N일 전 대비 상승률 계산 (업비트 일봉 캔들 API 활용)
    async function getCoinReturnRate(market, days) {
      try {
        // count = days + 1 만큼 일봉을 가져옴 (0번: 오늘, N번: N일 전)
        const res = await fetch(`https://api.upbit.com/v1/candles/days?market=${market}&count=${days + 1}`);
        const candles = await res.json();
        
        const todayPrice = candles[0].trade_price;
        const pastPrice = candles[candles.length - 1].trade_price;
        
        // 수익률 = (현재가 - 과거가) / 과거가 * 100
        const returnRate = ((todayPrice - pastPrice) / pastPrice) * 100;
        return returnRate;
      } catch (e) {
        return -999; // 조회 실패 시 최하위 처리
      }
    }

    // 3. 후보 코인들 중 최고 상승 코인 찾기
    async function findTopGainer() {
      winnerTextEl.innerText = `최근 ${selectedDays}일간 최고 상승 코인 찾는 중...`;

      let maxRate = -Infinity;
      let topCoinName = '';

      // 각 코인의 수익률을 차례대로 계산
      for (const coin of TARGET_COINS) {
        const rate = await getCoinReturnRate(coin.market, selectedDays);
        if (rate > maxRate) {
          maxRate = rate;
          topCoinName = coin.name;
        }
      }

      bestCoin = { name: topCoinName, rate: maxRate };
      
      // 결과 화면 표시
      winnerTextEl.innerText = `🏆 최근 ${selectedDays}일 최고 급등 1위 코인`;
      winnerNameEl.innerText = bestCoin.name;
      winnerRateEl.innerText = `${bestCoin.rate >= 0 ? '+' : ''}${bestCoin.rate.toFixed(2)}%`;

      updateCalculations();
    }

    // 4. 자산 및 추종 수익 계산하기
    function updateCalculations() {
      const count = parseFloat(shibCountInput.value) || 0;
      const myTotal = Math.round(count * currentShibPrice);
      currentTotalEl.innerText = `${myTotal.toLocaleString()} 원`;

      if (bestCoin.rate !== 0) {
        // 급등 코인의 상승률(%)을 내 자산에 적용
        const simulated = Math.round(myTotal * (1 + bestCoin.rate / 100));
        const diff = simulated - myTotal;

        simulatedTotalEl.innerText = `${simulated.toLocaleString()} 원`;
        diffProfitEl.innerText = `${diff >= 0 ? '+' : ''}${diff.toLocaleString()} 원 차이 발생!`;
      }
    }

    // 전체 데이터 갱신
    async function refreshAll() {
      await fetchShibPrice();
      await findTopGainer();
      const now = new Date();
      updatedTimeEl.innerText = `마지막 업데이트: ${now.toLocaleTimeString()}`;
    }

    // 이벤트 리스너 등록
    shibCountInput.addEventListener('input', updateCalculations);
    refreshBtn.addEventListener('click', refreshAll);

    // 기간 변경 버튼 클릭 이벤트
    btn7Days.addEventListener('click', () => {
      selectedDays = 7;
      btn7Days.classList.add('active');
      btn14Days.classList.remove('active');
      findTopGainer();
    });

    btn14Days.addEventListener('click', () => {
      selectedDays = 14;
      btn14Days.classList.add('active');
      btn7Days.classList.remove('active');
      findTopGainer();
    });

    // 페이지 진입 시 최초 1회 실행
    refreshAll();
  </script>
</body>
</html>
