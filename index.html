<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시바이누 자산 & 코인 실시간 수익률 비교기</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #f59e0b;
      --up: #ef4444;
      --down: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .header p {
      font-size: 14px;
      color: var(--text-sub);
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .coin-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #0f172a;
      padding: 2px;
      object-fit: cover;
    }

    .coin-header-info h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .coin-header-info span {
      font-size: 12px;
      color: var(--text-sub);
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-box:focus {
      border-color: var(--primary);
    }

    .info-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-sub);
    }

    .info-value {
      font-weight: 600;
    }

    .up { color: var(--up); }
    .down { color: var(--down); }

    .period-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .period-btn {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .period-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .comparison-summary {
      margin-top: auto;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1e293b, #111827);
      border: 1px solid #475569;
      text-align: center;
    }

    .comparison-diff {
      font-size: 20px;
      font-weight: 800;
      margin-top: 6px;
    }

    .diff-desc {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .custom-select-wrapper {
      position: relative;
    }

    select.input-box {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .refresh-badge {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🐕 시바이누 자산 & 마켓 급등 비교 시뮬레이터</h1>
    <p>실시간 업비트 시세 연동 및 상대적 상승률 비교</p>
  </div>

  <div class="container">
    <!-- 왼쪽: 시바이누 보유 자산 카드 -->
    <div class="card">
      <div class="card-title-row">
        <img class="coin-logo" src="https://static.upbit.com/logos/SHIB.png" onerror="this.src='https://assets.coingecko.com/coins/images/11939/small/shiba.png'" alt="SHIB 로고" />
        <div class="coin-header-info">
          <h2>시바이누 (SHIB)</h2>
          <span>내 보유 기준 코인</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="shibCount">보유 수량 (개)</label>
        <input type="number" id="shibCount" class="input-box" value="10000000" step="1000" />
      </div>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">실시간 현재가</span>
          <span class="info-value" id="shibPrice">조회 중...</span>
        </div>
        <div class="info-row">
          <span class="info-label">당일 24시간 변동률</span>
          <span class="info-value" id="shibRate24h">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">선택 기간 수익률</span>
          <span class="info-value" id="shibPeriodRate">-</span>
        </div>
        <div class="info-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);">
          <span class="info-label">내 평가 금액</span>
          <span class="info-value" style="font-size: 16px; color: #f59e0b;" id="shibTotalValue">0 원</span>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 비교 대상 코인 선택 카드 -->
    <div class="card">
      <div class="card-title-row">
        <img id="targetCoinLogo" class="coin-logo" src="https://static.upbit.com/logos/BTC.png" onerror="this.src='https://assets.coingecko.com/coins/images/1/small/bitcoin.png'" alt="코인 로고" />
        <div class="coin-header-info">
          <h2 id="targetCoinTitle">비트코인 (BTC)</h2>
          <span>비교 대상 코인</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">비교 기간 선택</label>
        <div class="period-selector">
          <button class="period-btn active" data-days="0">24시간 (실시간)</button>
          <button class="period-btn" data-days="7">최근 7일</button>
          <button class="period-btn" data-days="14">최근 14일</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="coinSelect">비교 코인 선택 (업비트/빗썸 상장 주요 종목)</label>
        <div class="custom-select-wrapper">
          <select id="coinSelect" class="input-box"></select>
        </div>
      </div>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">선택 코인 현재가</span>
          <span class="info-value" id="targetPrice">조회 중...</span>
        </div>
        <div class="info-row">
          <span class="info-label">선택 코인 상승률</span>
          <span class="info-value" id="targetRate">-</span>
        </div>
      </div>

      <!-- 상대 비교 결과 요약 -->
      <div class="comparison-summary">
        <div class="field-label" style="color: #cbd5e1;">시바이누 대비 상승 격차</div>
        <div class="comparison-diff" id="rateDiff">-</div>
        <div class="diff-desc" id="diffDescription">계산 중...</div>
      </div>
    </div>
  </div>

  <div class="refresh-badge" id="updateStatus">시세 연동 중...</div>

  <script>
    // 비교 가능한 주요 코인 목록
    const COIN_LIST = [
      { market: "KRW-BTC", symbol: "BTC", name: "비트코인" },
      { market: "KRW-ETH", symbol: "ETH", name: "이더리움" },
      { market: "KRW-SOL", symbol: "SOL", name: "솔라나" },
      { market: "KRW-XRP", symbol: "XRP", name: "리플" },
      { market: "KRW-DOGE", symbol: "DOGE", name: "도지코인" },
      { market: "KRW-ADA", symbol: "ADA", name: "에이다" },
      { market: "KRW-AVAX", symbol: "AVAX", name: "아발란체" },
      { market: "KRW-SEI", symbol: "SEI", name: "세이" },
      { market: "KRW-NEAR", symbol: "NEAR", name: "니어프로토콜" },
      { market: "KRW-SUI", symbol: "SUI", name: "수이" },
      { market: "KRW-APT", symbol: "APT", name: "앱토스" },
      { market: "KRW-LINK", symbol: "LINK", name: "체인링크" },
      { market: "KRW-ETC", symbol: "ETC", name: "이더리움클래식" },
      { market: "KRW-SAND", symbol: "SAND", name: "샌드박스" }
    ];

    let currentDays = 0; // 0 = 24h, 7 = 7일, 14 = 14일
    let shibData = { price: 0, rate24h: 0, periodRate: 0 };
    let targetData = { price: 0, rate: 0 };

    const shibCountInput = document.getElementById("shibCount");
    const shibPriceEl = document.getElementById("shibPrice");
    const shibRate24hEl = document.getElementById("shibRate24h");
    const shibPeriodRateEl = document.getElementById("shibPeriodRate");
    const shibTotalValueEl = document.getElementById("shibTotalValue");

    const coinSelect = document.getElementById("coinSelect");
    const targetCoinLogo = document.getElementById("targetCoinLogo");
    const targetCoinTitle = document.getElementById("targetCoinTitle");
    const targetPriceEl = document.getElementById("targetPrice");
    const targetRateEl = document.getElementById("targetRate");
    const rateDiffEl = document.getElementById("rateDiff");
    const diffDescriptionEl = document.getElementById("diffDescription");
    const updateStatusEl = document.getElementById("updateStatus");

    // 셀렉트 박스 옵션 생성
    function initCoinOptions() {
      coinSelect.innerHTML = COIN_LIST.map(coin => 
        `<option value="${coin.market}" data-symbol="${coin.symbol}" data-name="${coin.name}">${coin.name} (${coin.symbol})</option>`
      ).join("");
    }

    // 포맷팅 함수들
    const formatKRW = (num) => new Intl.NumberFormat('ko-KR').format(Math.round(num)) + ' 원';
    const formatCoinPrice = (num) => {
      if (num >= 100) return new Intl.NumberFormat('ko-KR').format(num) + ' 원';
      return num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + ' 원';
    };
    const formatRateText = (rate) => `${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%`;

    // N일 전 대비 수익률 계산 함수
    async function fetchPeriodReturn(market, days) {
      if (days === 0) {
        const res = await fetch(`https://api.upbit.com/v1/ticker?markets=${market}`);
        const data = await res.json();
        return (data[0].signed_change_rate * 100);
      } else {
        const res = await fetch(`https://api.upbit.com/v1/candles/days?market=${market}&count=${days + 1}`);
        const candles = await res.json();
        if (!candles || candles.length < days + 1) return 0;
        const current = candles[0].trade_price;
        const past = candles[days].trade_price;
        return ((current - past) / past) * 100;
      }
    }

    // 실시간 시세 및 수익률 갱신
    async function updateData() {
      try {
        const targetMarket = coinSelect.value;
        const targetOption = coinSelect.options[coinSelect.selectedIndex];
        const targetSymbol = targetOption.getAttribute("data-symbol");
        const targetName = targetOption.getAttribute("data-name");

        // 로고 및 타이틀 갱신
        targetCoinLogo.src = `https://static.upbit.com/logos/${targetSymbol}.png`;
        targetCoinTitle.innerText = `${targetName} (${targetSymbol})`;

        // 1. SHIB & 선택 코인 현재가 동시 조회
        const tickerRes = await fetch(`https://api.upbit.com/v1/ticker?markets=KRW-SHIB,${targetMarket}`);
        const tickers = await tickerRes.json();
        const shibTicker = tickers.find(t => t.market === 'KRW-SHIB');
        const targetTicker = tickers.find(t => t.market === targetMarket);

        shibData.price = shibTicker.trade_price;
        shibData.rate24h = shibTicker.signed_change_rate * 100;
        targetData.price = targetTicker.trade_price;

        // 2. 기간별 수익률 조회
        shibData.periodRate = await fetchPeriodReturn("KRW-SHIB", currentDays);
        targetData.rate = await fetchPeriodReturn(targetMarket, currentDays);

        // 3. UI 렌더링
        renderUI();

        const now = new Date();
        updateStatusEl.innerText = `마지막 업데이트: ${now.toLocaleTimeString()}`;
      } catch (err) {
        console.error("데이터 갱신 실패:", err);
        updateStatusEl.innerText = "데이터 갱신 중 오류가 발생했습니다.";
      }
    }

    function renderUI() {
      // SHIB 카드
      shibPriceEl.innerText = formatCoinPrice(shibData.price);
      shibRate24hEl.innerText = formatRateText(shibData.rate24h);
      shibRate24hEl.className = `info-value ${shibData.rate24h >= 0 ? 'up' : 'down'}`;

      shibPeriodRateEl.innerText = formatRateText(shibData.periodRate);
      shibPeriodRateEl.className = `info-value ${shibData.periodRate >= 0 ? 'up' : 'down'}`;

      const count = parseFloat(shibCountInput.value) || 0;
      const shibTotalVal = count * shibData.price;
      shibTotalValueEl.innerText = formatKRW(shibTotalVal);

      // 대상 코인 카드
      targetPriceEl.innerText = formatCoinPrice(targetData.price);
      targetRateEl.innerText = formatRateText(targetData.rate);
      targetRateEl.className = `info-value ${targetData.rate >= 0 ? 'up' : 'down'}`;

      // 상승률 비교 격차 계산 (선택코인 상승률 - 시바이누 상승률)
      const diffRate = targetData.rate - shibData.periodRate;
      rateDiffEl.innerText = `${diffRate >= 0 ? '+' : ''}${diffRate.toFixed(2)}%p`;
      rateDiffEl.className = `comparison-diff ${diffRate >= 0 ? 'up' : 'down'}`;

      // 차액 시뮬레이션
      const diffAmount = shibTotalVal * (diffRate / 100);
      const signText = diffAmount >= 0 ? '더 높았을 금액' : '적었을 금액';
      diffDescriptionEl.innerText = `내 자산 기준 ${formatKRW(Math.abs(diffAmount))} ${signText}`;
    }

    // 이벤트 리스너 등록
    shibCountInput.addEventListener("input", renderUI);

    coinSelect.addEventListener("change", () => {
      updateData();
    });

    document.querySelectorAll(".period-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentDays = parseInt(e.target.getAttribute("data-days"), 10);
        updateData();
      });
    });

    // 시작점
    initCoinOptions();
    updateData();
    // 5초마다 실시간 시세 자동 갱신
    setInterval(updateData, 5000);
  </script>
</body>
</html>
